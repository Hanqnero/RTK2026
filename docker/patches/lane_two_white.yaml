# lane.yaml для реального робота: обе полосы белые (нет жёлтой).
# "yellow" маска настроена идентично "white" — detect_lane ищет белый цвет с обеих сторон.
# Значения подобраны под реальное освещение — возможно потребуется калибровка через rqt.
---
/detect_lane:
  ros__parameters:
    detect:
      lane:
        white:
          hue_h: 179
          hue_l: 0
          lightness_h: 255
          lightness_l: 105
          saturation_h: 60
          saturation_l: 0
        yellow:
          hue_h: 179
          hue_l: 0
          lightness_h: 255
          lightness_l: 105
          saturation_h: 60
          saturation_l: 0
