services:
  robot_runtime:
    platform: linux/arm64/v8
    build:
      context: ..
      dockerfile: docker/Dockerfile.robot_runtime.jazzy
    image: rtk2026-robot-runtime:jazzy
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
      source /workspace/install/setup.bash &&
      ros2 launch rtk2026_bringup robot_runtime.launch.py"
    environment:
      - ROS_DOMAIN_ID=0
    network_mode: host

