# Route editor (Nav2 Route Tool + costmap) в браузере: http://localhost:6083/vnc.html
# Карты: docker/saved_maps/*.yaml (+ pgm). По умолчанию rtk2026_arena.yaml.
#
# Из каталога RTK2026-2/docker:
#   docker compose -f docker-compose.route_editor.yml build && docker compose -f docker-compose.route_editor.yml up
#
# Из корня репозитория (ROBO-RTK): см. docker-compose.route_editor.yml в корне.
#
# Другая карта: MAP_YAML=/workspace/maps/my_map.yaml docker compose -f docker-compose.route_editor.yml up

services:
  route_editor:
    platform: linux/arm64/v8
    build:
      context: ..
      dockerfile: docker/Dockerfile.route_editor
    image: rtk2026-route-editor:jazzy-main
    command: ["/scripts/start_route_editor.sh"]
    ports:
      - "6083:6083"
    volumes:
      - ./saved_maps:/workspace/maps:rw
    environment:
      - ROS_DOMAIN_ID=0
      - MAP_YAML=${MAP_YAML:-/workspace/maps/rtk2026_arena.yaml}
      - NOVNC_PORT=6083
      - LANE_POSE_TOPIC=${LANE_POSE_TOPIC:-/goal_pose}
      - LANE_CURRENT_VERTEX=${LANE_CURRENT_VERTEX:-5}
      - LANE_DETECTED_SIGN_TARGET_VERTEX=${LANE_DETECTED_SIGN_TARGET_VERTEX:--1}
      - LANE_DIRECTION_MODE=${LANE_DIRECTION_MODE:-forward}
      - LANE_TICK_RATE_HZ=${LANE_TICK_RATE_HZ:-2.0}
      - LANE_LOG_EVERY_N_TICKS=${LANE_LOG_EVERY_N_TICKS:-1}
