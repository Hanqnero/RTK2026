services:
  robot_runtime:
    platform: linux/arm64/v8
    build:
      context: ..
      dockerfile: docker/Dockerfile.robot_runtime.jazzy
    image: rtk2026-robot-runtime:jazzy
    command: >
      bash -lc "source /opt/ros/jazzy/setup.bash &&
      source /workspace/install/setup.bash &&
      exec ros2 launch rtk2026_bringup robot_runtime.launch.py
      arduino_serial_port:=${ARDUINO_SERIAL_PORT:-/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0}
      arduino_baudrate:=${ARDUINO_BAUDRATE:-115200}
      use_camera:=${USE_CAMERA:-true}
      camera_driver:=${CAMERA_DRIVER:-usb_cam}
      camera_device:=${CAMERA_DEVICE:-/dev/video0}
      camera_frame_id:=${CAMERA_FRAME_ID:-camera_link}
      camera_width:=${CAMERA_WIDTH:-640}
      camera_height:=${CAMERA_HEIGHT:-480}
      camera_fps:=${CAMERA_FPS:-10.0}
      use_lidar:=${USE_LIDAR:-true}
      lidar_serial_port:=${LIDAR_SERIAL_PORT:-/dev/ttyUSB1}
      lidar_frame_id:=${LIDAR_FRAME_ID:-lidar_link}
      use_realsense_imu:=${USE_REALSENSE_IMU:-false}
      use_bmi270_imu:=${USE_BMI270_IMU:-false}
      bmi270_backend:=${BMI270_BACKEND:-spi}
      bmi270_iio_device_name:=${BMI270_IIO_DEVICE_NAME:-bmi270}
      bmi270_iio_device_path:=${BMI270_IIO_DEVICE_PATH:-__unset__}
      bmi270_spi_bus:=${BMI270_SPI_BUS:-0}
      bmi270_spi_device:=${BMI270_SPI_DEVICE:-0}
      bmi270_spi_mode:=${BMI270_SPI_MODE:-0}
      bmi270_spi_max_speed_hz:=${BMI270_SPI_MAX_SPEED_HZ:-1000000}
      bmi270_accel_x_sign:=${BMI270_ACCEL_X_SIGN:-1.0}
      bmi270_accel_y_sign:=${BMI270_ACCEL_Y_SIGN:-1.0}
      bmi270_accel_z_sign:=${BMI270_ACCEL_Z_SIGN:-1.0}
      bmi270_gyro_x_sign:=${BMI270_GYRO_X_SIGN:-1.0}
      bmi270_gyro_y_sign:=${BMI270_GYRO_Y_SIGN:-1.0}
      bmi270_gyro_z_sign:=${BMI270_GYRO_Z_SIGN:-1.0}
      bmi270_frame_id:=${BMI270_FRAME_ID:-imu_link}
      bmi270_publish_rate_hz:=${BMI270_PUBLISH_RATE_HZ:-100.0}
      use_ekf:=${USE_EKF:-true}
      use_slam_toolbox:=${USE_SLAM_TOOLBOX:-false}"
    environment:
      ROS_DOMAIN_ID: "0"
      ARDUINO_SERIAL_PORT: ${ARDUINO_SERIAL_PORT:-/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0}
      ARDUINO_BAUDRATE: ${ARDUINO_BAUDRATE:-115200}
      USE_CAMERA: ${USE_CAMERA:-true}
      CAMERA_DRIVER: ${CAMERA_DRIVER:-usb_cam}
      CAMERA_DEVICE: ${CAMERA_DEVICE:-/dev/video0}
      CAMERA_FRAME_ID: ${CAMERA_FRAME_ID:-camera_link}
      CAMERA_OPTICAL_FRAME_ID: ${CAMERA_OPTICAL_FRAME_ID:-camera_optical_link}
      CAMERA_WIDTH: ${CAMERA_WIDTH:-640}
      CAMERA_HEIGHT: ${CAMERA_HEIGHT:-480}
      CAMERA_FPS: ${CAMERA_FPS:-10.0}
      USE_LIDAR: ${USE_LIDAR:-true}
      LIDAR_SERIAL_PORT: ${LIDAR_SERIAL_PORT:-/dev/ttyUSB1}
      LIDAR_FRAME_ID: ${LIDAR_FRAME_ID:-lidar_link}
      USE_REALSENSE_IMU: ${USE_REALSENSE_IMU:-false}
      USE_BMI270_IMU: ${USE_BMI270_IMU:-false}
      BMI270_BACKEND: ${BMI270_BACKEND:-spi}
      BMI270_IIO_DEVICE_NAME: ${BMI270_IIO_DEVICE_NAME:-bmi270}
      BMI270_IIO_DEVICE_PATH: ${BMI270_IIO_DEVICE_PATH:-__unset__}
      BMI270_SPI_BUS: ${BMI270_SPI_BUS:-0}
      BMI270_SPI_DEVICE: ${BMI270_SPI_DEVICE:-0}
      BMI270_SPI_MODE: ${BMI270_SPI_MODE:-0}
      BMI270_SPI_MAX_SPEED_HZ: ${BMI270_SPI_MAX_SPEED_HZ:-1000000}
      BMI270_ACCEL_X_SIGN: ${BMI270_ACCEL_X_SIGN:-1.0}
      BMI270_ACCEL_Y_SIGN: ${BMI270_ACCEL_Y_SIGN:-1.0}
      BMI270_ACCEL_Z_SIGN: ${BMI270_ACCEL_Z_SIGN:-1.0}
      BMI270_GYRO_X_SIGN: ${BMI270_GYRO_X_SIGN:-1.0}
      BMI270_GYRO_Y_SIGN: ${BMI270_GYRO_Y_SIGN:-1.0}
      BMI270_GYRO_Z_SIGN: ${BMI270_GYRO_Z_SIGN:-1.0}
      BMI270_FRAME_ID: ${BMI270_FRAME_ID:-imu_link}
      BMI270_PUBLISH_RATE_HZ: ${BMI270_PUBLISH_RATE_HZ:-100.0}
      USE_EKF: ${USE_EKF:-true}
      USE_SLAM_TOOLBOX: ${USE_SLAM_TOOLBOX:-false}
      IMU_DEVICE: ${IMU_DEVICE:-/dev/i2c-1}
      IMU_FRAME_ID: ${IMU_FRAME_ID:-imu_link}
    network_mode: host
    privileged: true
    volumes:
      - /dev:/dev
    restart: unless-stopped

  localization:
    platform: linux/arm64/v8
    image: rtk2026-robot-runtime:jazzy
    command: >
      bash -lc "source /opt/ros/jazzy/setup.bash &&
      source /workspace/install/setup.bash &&
      exec /scripts/start_localization.sh"
    volumes:
      - ./config/amcl.yaml:/workspace/amcl.yaml:ro
      - ./saved_maps:/workspace/maps:ro
      - ../src/rtk2026_route_nav/config:/workspace/runtime_config:ro
    environment:
      ROS_DOMAIN_ID: "0"
      MAP_YAML: ${MAP_YAML:-/workspace/maps/new_map.yaml}
      GRAPH_FILEPATH: ${GRAPH_FILEPATH:-/workspace/runtime_config/graph.geojson}
      INITIAL_VERTEX_ID: ${INITIAL_VERTEX_ID:-5}
      ROBOT_SPAWN_YAW: ${ROBOT_SPAWN_YAW:-3.141592653589793}
      LOCALIZATION_USE_SIM_TIME: ${LOCALIZATION_USE_SIM_TIME:-false}
    network_mode: host
    depends_on:
      - robot_runtime
    restart: unless-stopped

  perception:
    platform: linux/arm64/v8
    image: rtk2026-robot-runtime:jazzy
    command: >
      bash -lc "source /opt/ros/jazzy/setup.bash &&
      source /workspace/install/setup.bash &&
      exec ros2 launch rtk2026_cv onnx_sign_detector.launch.py"
    environment:
      ROS_DOMAIN_ID: "0"
    network_mode: host
    depends_on:
      - robot_runtime
    restart: unless-stopped

  foxglove:
    platform: linux/arm64/v8
    image: rtk2026-robot-runtime:jazzy
    command: >
      bash -lc "source /opt/ros/jazzy/setup.bash &&
      source /workspace/install/setup.bash &&
      exec ros2 launch foxglove_bridge foxglove_bridge_launch.xml
      port:=${FOXGLOVE_PORT:-8765}
      address:=0.0.0.0"
    environment:
      ROS_DOMAIN_ID: "0"
      FOXGLOVE_PORT: ${FOXGLOVE_PORT:-8765}
    ports:
      - "${FOXGLOVE_PORT:-8765}:${FOXGLOVE_PORT:-8765}"
    network_mode: host
    depends_on:
      - robot_runtime
    restart: unless-stopped

  route_editor_full:
    platform: linux/arm64/v8
    build:
      context: ..
      dockerfile: docker/Dockerfile.route_editor_full
    image: rtk2026-route-editor:jazzy-full
    command: ["/scripts/start_route_editor.sh"]
    volumes:
      - ./saved_maps:/workspace/maps:rw
      - ../src/rtk2026_route_nav/config:/workspace/runtime_config:ro
    environment:
      ROS_DOMAIN_ID: "0"
      NOVNC_PORT: ${ROUTE_EDITOR_NOVNC_PORT:-6084}
      MAP_YAML: ${MAP_YAML:-/workspace/maps/new_map.yaml}
      USE_SIM_TIME: ${USE_SIM_TIME:-false}
      USE_VECTOR_SERVER: ${USE_VECTOR_SERVER:-true}
      AUTO_LOAD_KEEPOUT: ${AUTO_LOAD_KEEPOUT:-true}
      START_RVIZ: ${START_RVIZ:-true}
      ENABLE_LANE_MANAGER: ${ENABLE_LANE_MANAGER:-false}
      PUBLISH_MAP_ODOM_STATIC_TF: ${PUBLISH_MAP_ODOM_STATIC_TF:-false}
      GRAPH_FILEPATH: ${GRAPH_FILEPATH:-/workspace/runtime_config/graph.geojson}
      COSTMAP_PARAMS_FILE: ${COSTMAP_PARAMS_FILE:-/workspace/runtime_config/route_editor_global_costmap_full.yaml}
      NAV2_EXECUTION_PARAMS_FILE: ${NAV2_EXECUTION_PARAMS_FILE:-/workspace/runtime_config/nav2_execution_params.yaml}
      LANE_PARAMS_FILE: ${LANE_PARAMS_FILE:-/workspace/runtime_config/lane_decision_manager_v3.yaml}
      LANE_MANAGER_EXECUTABLE: ${LANE_MANAGER_EXECUTABLE:-lane_decision_manager_v3}
      LANE_POSE_TOPIC: ${LANE_POSE_TOPIC:-/goal_pose}
      LANE_CURRENT_VERTEX: ${LANE_CURRENT_VERTEX:-5}
      LANE_PREVIOUS_VERTEX: ${LANE_PREVIOUS_VERTEX:--1}
      LANE_DETECTED_SIGN_TARGET_VERTEX: ${LANE_DETECTED_SIGN_TARGET_VERTEX:--1}
      LANE_DIRECTION_MODE: ${LANE_DIRECTION_MODE:-lane1}
      LANE_TICK_RATE_HZ: ${LANE_TICK_RATE_HZ:-2.0}
      LANE_LOG_EVERY_N_TICKS: ${LANE_LOG_EVERY_N_TICKS:-1}
    network_mode: host
    depends_on:
      - localization
      - perception
    restart: unless-stopped

  rviz_novnc:
    platform: linux/arm64/v8
    build:
      context: ..
      dockerfile: docker/Dockerfile.route_editor
    image: rtk2026-route-editor:jazzy-main
    command: ["/scripts/start_rviz_novnc.sh"]
    volumes:
      - ./local_rviz/rtk2026_slam.rviz:/workspace/slam.rviz:ro
    environment:
      ROS_DOMAIN_ID: "0"
      USE_SIM_TIME: ${USE_SIM_TIME:-false}
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_X11_NO_MITSHM: "1"
      RVIZ_CONFIG: /workspace/slam.rviz
      NOVNC_PORT: ${RVIZ_NOVNC_PORT:-6082}
    network_mode: host
    depends_on:
      - localization
    restart: unless-stopped
