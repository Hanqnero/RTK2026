# DDS Router на Raspberry Pi: сторона робота.
#
# Роль в схеме
# ------------
#
# Pi - TCP-сервер, Mac - TCP-клиент. Направление TCP-соединения не связано
# с направлением ROS-данных: после установления канала обмен идёт в обе
# стороны. Сервером сделана Pi потому, что она доступна по фиксированному
# адресу в локальной сети, а контейнер на Docker Desktop за NAT - нет.
#
# Зачем вообще Router
# -------------------
#
# Между Mac-контейнером и Pi нет надёжного multicast: Docker Desktop не даёт
# контейнеру настоящий сетевой namespace хоста. Router заменяет автообнаружение
# одним явным TCP-соединением.
#
# Router не разбирает и не переупаковывает данные: он не знает ни про кадры
# ROS, ни про содержимое сообщений. Поэтому QoS и типы согласуются между
# настоящими участниками, а не между ними и Router.

version: v5.0

participants:

  # Обычный DDS-участник в локальном графе Pi. Обнаруживает ноды робота:
  # SLAM, EKF, драйверы датчиков, robot_state_publisher, observability.
  - name: pi_local
    kind: local
    domain: 0

  # Приём соединения от Mac.
  #
  # ip: адрес, на котором Router слушает и который объявляет удалённой
  # стороне. На настоящей Raspberry Pi это её адрес в локальной сети.
  #
  # Значение подставляется на запуске из переменной PI_ADDRESS, поэтому
  # при смене сети образ пересобирать не нужно.
  #
  # В локальной репетиции (docker-compose.local.yml) сюда подставляется
  # 0.0.0.0: контейнер "робота" сидит за NAT Docker, его собственный адрес
  # второй стороне недоступен, и она приходит на опубликованный порт хоста.
  # Соединение при этом инициирует клиент, и обмен идёт по нему в обе
  # стороны, так что объявленный адрес для передачи данных не используется.
  - name: mac_link
    kind: wan
    listening-addresses:
      - ip: 192.168.1.50
        port: 11666
        transport: tcp

specs:

  # Обязательно false.
  #
  # При true Router удаляет endpoints, которыми никто не пользуется, и это
  # несовместимо с durability TRANSIENT_LOCAL. Пострадали бы ровно те топики,
  # ради которых late-joining RViz и запускается: /tf_static и карта.
  remove-unused-entities: false

  # Создавать маршрут, когда на другой стороне появился reader.
  #
  # Совпадает с тем, как ведёт себя RViz: он подписывается на то, что ему
  # нужно, и Router создаёт встречные endpoints по факту подписки.
  discovery-trigger: reader

# QoS маршрутизируемых топиков
# ---------------------------
#
# Router не пробрасывает сообщения насквозь: он создаёт собственные endpoints
# и согласуется с настоящими участниками по обычным правилам DDS. По умолчанию
# эти endpoints reliable + volatile, поэтому топики с другим QoS молча
# не проходят - соединение установлено, топик виден, данных нет.
#
# Задеть это может ровно то, ради чего схема и строится:
#
#   /scan       best-effort лидар не согласуется с reliable-endpoint Router;
#   /tf_static  подключившийся позже RViz не получает удержанное значение;
#   /map        то же самое, карта не появляется вовсе.
#
# durability: true соответствует TRANSIENT_LOCAL, reliability: false -
# BEST_EFFORT. Имена записываются в DDS-нотации: топик ROS /scan это rt/scan.
#
# Секция не ограничивает маршрутизацию: топики, здесь не перечисленные,
# передаются с QoS по умолчанию. Ограничение задаётся allowlist.
#
# Списки на обеих сторонах обязаны совпадать.
topics:

  # Удерживаемые топики: значение публикуется однократно и должно дойти
  # до подписчика, запущенного позже.
  - name: "rt/tf_static"
    qos:
      durability: true
      reliability: true

  - name: "rt/map"
    qos:
      durability: true
      reliability: true

  - name: "rt/check/latched"
    qos:
      durability: true
      reliability: true

  # Модель робота. robot_state_publisher публикует её однократно и
  # удерживает, поэтому без durability RViz показал бы пустой RobotModel:
  # подписка происходит уже после публикации и без удержания не получает
  # ничего. Отказ тихий - ошибок в логе нет, просто нет модели.
  - name: "rt/robot_description"
    qos:
      durability: true
      reliability: true

  # Метаданные карты: размер, разрешение и origin. Публикуются рядом с
  # самой картой и с тем же удержанием.
  - name: "rt/map_metadata"
    qos:
      durability: true
      reliability: true

  # Динамическое дерево TF: odom -> base_footprint от EKF и map -> odom
  # от slam_toolbox. Без него на ноутбуке нет НИЧЕГО: RViz не может
  # разрешить Fixed Frame и пишет "No tf data", хотя карта и скан идут.
  # Удержание не нужно и вредно - трансформации публикуются непрерывно,
  # и хранить устаревшую бессмысленно.
  - name: "rt/tf"
    qos:
      durability: false
      reliability: true

  # Выход EKF: по нему RViz рисует пройденный путь.
  - name: "rt/odometry/filtered"
    qos:
      durability: false
      reliability: true

  # Датчики: потеря отдельного сообщения допустима, повторная передача
  # только увеличила бы задержку.
  - name: "rt/scan"
    qos:
      reliability: false

  - name: "rt/check/sensor"
    qos:
      reliability: false

# На этапе внедрения списки не задаются: Router маршрутизирует всё
# обнаруженное. Так меньше шансов, что что-то не поехало из-за опечатки
# в имени топика.
#
# Когда схема заработает и появится тяжёлый трафик с камер, имеет смысл
# ограничить маршрутизацию явно. Имена в DDS-нотации: топик ROS /scan
# соответствует rt/scan.
#
# allowlist:
#   - name: "rt/tf"
#   - name: "rt/tf_static"
#   - name: "rt/map"
#   - name: "rt/scan"
#   - name: "rt/wheel/odom"
#   - name: "rt/odometry/filtered"
#   - name: "rt/diagnostics"
#   - name: "rt/diagnostics_agg"
#
# blocklist:
#   - name: "rt/camera/image_raw"
