services:
  sim:

    build:
      # Корнем контекста является корень проекта.
      #
      # Поэтому Dockerfile имеет доступ к:
      # src/
      # docker/start_sim_novnc.sh
      context: ..

      # Путь относительно build context.
      dockerfile: docker/Dockerfile.sim

    # Фиксированное имя контейнера.
    container_name: rtk2026_sim

    volumes:
      # Карты и pose graph сразу записываются в каталог maps/ на компьютере.
      - ../maps:/workspace/maps
      # Записи экспериментов сразу сохраняются на компьютере.
      - ../records:/workspace/records
      # Сформированные графики и HTML-отчёты.
      - ../reports:/workspace/reports

    # Добавляет минимальный init-процесс.
    #
    # Он передаёт сигналы и удаляет завершившиеся
    # дочерние процессы.
    init: true

    ports:
      # noVNC доступен только на этом Mac.
      #
      # Порт 6080 на macOS перенаправляется
      # на порт 6080 внутри контейнера.
      - "127.0.0.1:6080:6080"

      # Второй рабочий стол для PlotJuggler и RQt.
      - "127.0.0.1:6081:6081"

    environment:
      # X11-дисплей, создаваемый Xvfb.
      DISPLAY: ":1"

      # Независимый X11-дисплей диагностических GUI.
      DIAGNOSTICS_DISPLAY: ":2"

      # Отключение MIT-SHM для Qt.
      QT_X11_NO_MITSHM: "1"

      # Программный рендеринг OpenGL.
      LIBGL_ALWAYS_SOFTWARE: "1"

      # Runtime-каталог графических приложений.
      XDG_RUNTIME_DIR: "/tmp/runtime-root"

    # Увеличенный /dev/shm для Gazebo и RViz.
    shm_size: "1gb"

    # Оставляет stdin открытым.
    stdin_open: true

    # Создаёт псевдотерминал.
    tty: true

    # Даёт ROS-процессам время завершиться
    # после получения SIGTERM.
    stop_grace_period: 20s
