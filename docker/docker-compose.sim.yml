services:
  sim:

    build:
      # Корнем контекста является корень проекта.
      #
      # Поэтому Dockerfile имеет доступ к:
      # src/
      # docker/start_sim_novnc.sh
      context: ..

      # Путь относительно build context.
      dockerfile: docker/Dockerfile.sim


    # Фиксированное имя контейнера.
    container_name: rtk2026_sim

    volumes:
      # Отдельный sim workspace хранит build/install/log на хосте.
      - ../workspaces/sim_ws:/workspaces/sim_ws
      - ../src:/workspaces/sim_ws/src

      # Карты и граф сразу записываются в каталог maps/ на компьютере.
      - ../maps:/workspaces/sim_ws/maps
      # Записи экспериментов сразу сохраняются на компьютере.
      - ../records:/workspaces/sim_ws/records
      # Сформированные графики и HTML-отчёты.
      - ../reports:/workspaces/sim_ws/reports
      # Файл поз и память о знаках: их пишет робот, а читать и править
      # их надо с компьютера.
      - ../runtime:/workspaces/sim_ws/runtime
      - ../worlds:/workspaces/sim_ws/worlds

      # Используется только при DISPLAY_MODE=x11 на Linux.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    # Добавляет минимальный init-процесс.
    #
    # Он передаёт сигналы и удаляет завершившиеся
    # дочерние процессы.
    init: true

    ports:
      # noVNC доступен только на этом Mac.
      #
      # Порт 6080 на macOS перенаправляется
      # на порт 6080 внутри контейнера.
      - "127.0.0.1:6080:6080"

      # Второй рабочий стол для PlotJuggler и RQt.
      - "127.0.0.1:6081:6081"

    environment:
      # novnc (по умолчанию) или x11 для дисплея Linux-хоста.
      DISPLAY_MODE: ${DISPLAY_MODE:-novnc}

      # В x11-режиме передаётся DISPLAY хоста. В novnc-режиме entrypoint
      # использует VNC_DISPLAY независимо от этого значения.
      DISPLAY: ${DISPLAY:-}
      VNC_DISPLAY: ":1"

      # Независимый X11-дисплей диагностических GUI.
      DIAGNOSTICS_DISPLAY: ":2"

      # Отключение MIT-SHM для Qt.
      QT_X11_NO_MITSHM: "1"

      # Программный рендеринг OpenGL.
      LIBGL_ALWAYS_SOFTWARE: "1"

      # Runtime-каталог графических приложений.
      XDG_RUNTIME_DIR: "/tmp/runtime-root"

    # Увеличенный /dev/shm для Gazebo и RViz.
    shm_size: "1gb"

    # Оставляет stdin открытым.
    stdin_open: true

    # Создаёт псевдотерминал.
    tty: true

    # Даёт ROS-процессам время завершиться
    # после получения SIGTERM.
    stop_grace_period: 20s
