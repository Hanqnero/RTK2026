# Запускается на Raspberry Pi.
#
#   docker compose -f pi/docker/docker-compose.pi.yml up link        # ретранслятор порта
#   docker compose -f pi/docker/docker-compose.pi.yml run --rm build # собрать прошивку
#   docker compose -f pi/docker/docker-compose.pi.yml run --rm flash # собрать и прошить
#   docker compose -f pi/docker/docker-compose.pi.yml up -d --build ros # ROS2: hardware stack
#
# ВАЖНО: link, flash и ros не могут работать одновременно - все три
# конкурируют за serial-порт /dev/arduino. Перед прошивкой или запуском ros
# остановите остальных.
#
# Контекст сборки - корень репозитория (../..): контейнеру нужны и
# прошивка из arduino/, и ретранслятор из pi/tools/, а эта директория
# сама лежит внутри pi/docker/.

services:
  link:
    build:
      context: ../..
      dockerfile: pi/docker/Dockerfile.pi
    image: rtk2026-arduino-pi
    container_name: rtk2026-link
    volumes:
      - ../..:/work
    devices:
      # Пробросьте стабильный путь устройства. Найти его:
      #   ls -l /dev/serial/by-id/
      - "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0:/dev/arduino"
    ports:
      - "5555:5555"
    restart: unless-stopped
    command: >
      python3 pi/tools/link_server.py
      --device /dev/arduino
      --listen 0.0.0.0
      --port 5555

  # Сборка прошивки без прошивки платы. Устройство не нужно.
  build:
    build:
      context: ../..
      dockerfile: pi/docker/Dockerfile.pi
    image: rtk2026-arduino-pi
    volumes:
      - ../..:/work
    command: bash pi/docker/build_firmware.sh

  # Сборка и заливка. Требует свободного порта.
  flash:
    build:
      context: ../..
      dockerfile: pi/docker/Dockerfile.pi
    image: rtk2026-arduino-pi
    volumes:
      - ../..:/work
    devices:
      - "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0:/dev/arduino"
    command: bash pi/docker/flash_firmware.sh

  # Оболочка для ручных команд.
  shell:
    build:
      context: ../..
      dockerfile: pi/docker/Dockerfile.pi
    image: rtk2026-arduino-pi
    volumes:
      - ../..:/work
    devices:
      - "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0:/dev/arduino"
    command: bash
    stdin_open: true
    tty: true

  # ROS 2 реального робота: привод, лидар, EKF и SLAM.
  #
  # network_mode: host + ipc: host обязательны вместе, как и в
  # docker/dds_check/docker-compose.pi.yml: DDS на одном хосте выбирает
  # shared memory, а /dev/shm у контейнера без ipc: host свой собственный -
  # обмен тихо не пойдёт. ROS_DOMAIN_ID и RMW те же, что у DDS Router
  # (docker/dds_check/), чтобы эти ноды попали в тот локальный граф, который
  # Router прокидывает на ноутбук.
  ros:
    build:
      context: ../..
      dockerfile: pi/docker/Dockerfile.ros
    image: rtk2026-ros-pi
    container_name: rtk2026-ros
    network_mode: host
    ipc: host
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: "0"
      ROS_LOCALHOST_ONLY: "0"
      # Используем реальный display хоста. :0 — обычный
      # X11/Xwayland display Raspberry Pi с локальным desktop.
      #
      # Перенос строки здесь обязателен: при слиянии он потерялся,
      # DISPLAY ушёл в комментарий, и YAML разобрался без ошибок -
      # отказ был тихим, проброс X11 просто не работал.
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.Xauthority
      QT_X11_NO_MITSHM: "1"
      # Не требует проброса /dev/dri; для RViz на Pi это медленнее,
      # зато headless-запуск ros не зависит от наличия GPU device.
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
      XDG_RUNTIME_DIR: /tmp/runtime-root
    volumes:
      # XAUTHORITY может быть не ~/.Xauthority (например, у
      # Xwayland он живёт в /run/user/<uid>). Поэтому монтируем
      # именно файл из окружения, с fallback для обычного Xorg.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - "${XAUTHORITY:-${HOME}/.Xauthority}:/tmp/.Xauthority:ro"
      - /etc/localtime:/etc/localtime:ro
      - ../../workspaces/robot_ws:/workspaces/robot_ws
      - ../../src/rtk2026_driver:/workspaces/robot_ws/src/rtk2026_driver
      - ../../src/rtk2026_description:/workspaces/robot_ws/src/rtk2026_description
      - ../../src/rtk2026_localization:/workspaces/robot_ws/src/rtk2026_localization
      - ../../src/rtk2026_slam:/workspaces/robot_ws/src/rtk2026_slam
      - ../../src/rtk2026_observability:/workspaces/robot_ws/src/rtk2026_observability
      - ../../src/rtk2026_bringup:/workspaces/robot_ws/src/rtk2026_bringup
      - ../../src/rtk2026_interfaces:/workspaces/robot_ws/src/rtk2026_interfaces
      - ../../src/rtk2026_pose_graph:/workspaces/robot_ws/src/rtk2026_pose_graph
      - ../../src/rtk2026_nav2:/workspaces/robot_ws/src/rtk2026_nav2
      - ../../src/rtk2026_city_nav:/workspaces/robot_ws/src/rtk2026_city_nav
      - ../../maps:/workspaces/robot_ws/maps
      - ../../records:/workspaces/robot_ws/records
    devices:
      # Пути по идентификатору устройства, а не /dev/ttyUSB0 и ttyUSB1:
      # номера присваиваются в порядке подключения и после перезагрузки
      # могут поменяться местами, а идентификатор постоянен.
      #
      # Arduino - мост CH340 (вендор 1a86), лидар C1 - CP2102N от Silicon
      # Labs. Именно CP2102N и с длинным серийником: у прежнего A1M8 стоял
      # CP2102 с серийником 0001, и путь от него здесь не подойдёт.
      - "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0:/dev/arduino"
      - "/dev/serial/by-id/usb-Silicon_Labs_CP2102N_USB_to_UART_Bridge_Controller_5816f0d8d96ff0118dde93301045c30f-if00-port0:/dev/rplidar"
      #
      # Шина I2C для BMI270. В отличие от USB, номер здесь постоянный:
      # это контроллер самой Pi на GPIO2/GPIO3, а не устройство,
      # получающее номер в порядке подключения.
      #
      # Шину надо предварительно включить на хосте:
      #   sudo raspi-config nonint do_i2c 0 && sudo reboot
      # проверить наличие узла: ls -l /dev/i2c-1
      # и увидеть чип: i2cdetect -y 1  (ждём 68 или 69)
      - "/dev/i2c-1:/dev/i2c-1"
      #
      # Камера здесь НЕ объявлена намеренно, хотя стоит на той же Pi:
      # иначе стек не поднялся бы без неё. Она вынесена в сервис camera
      # ниже, по тому же принципу, что и lidar.
    init: true
    stdin_open: true
    tty: true

  # ~ Только лидар, без остального железа.
  #
  # Зачем отдельный сервис, а не ros
  # --------------------------------
  #
  # Docker резолвит каждую запись devices при старте контейнера и
  # отказывается запускать его, если хоть одного устройства нет. У ros
  # объявлены Arduino и шина I2C, поэтому при отключённой периферии он не
  # поднимется вовсе - а отлаживать лидар удобно именно так, в одиночку.
  #
  # Здесь объявлен ровно один device, поэтому сервис стартует, пока на
  # роботе есть лидар, и не зависит от всего прочего.
  #
  #     docker compose -f pi/docker/docker-compose.pi.yml up -d lidar
  #     docker logs -f rtk2026-lidar
  lidar:
    build:
      context: ../..
      dockerfile: pi/docker/Dockerfile.ros
    image: rtk2026-ros-pi
    container_name: rtk2026-lidar
    network_mode: host
    ipc: host
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: "0"
      ROS_LOCALHOST_ONLY: "0"
    volumes:
      - ../../workspaces/robot_ws:/workspaces/robot_ws
      - ../../src/rtk2026_driver:/workspaces/robot_ws/src/rtk2026_driver
      - ../../src/rtk2026_description:/workspaces/robot_ws/src/rtk2026_description
      - ../../src/rtk2026_localization:/workspaces/robot_ws/src/rtk2026_localization
      - ../../src/rtk2026_slam:/workspaces/robot_ws/src/rtk2026_slam
      - ../../src/rtk2026_observability:/workspaces/robot_ws/src/rtk2026_observability
      - ../../src/rtk2026_bringup:/workspaces/robot_ws/src/rtk2026_bringup
      - ../../src/rtk2026_interfaces:/workspaces/robot_ws/src/rtk2026_interfaces
      - ../../src/rtk2026_pose_graph:/workspaces/robot_ws/src/rtk2026_pose_graph
      - ../../src/rtk2026_nav2:/workspaces/robot_ws/src/rtk2026_nav2
      - ../../src/rtk2026_city_nav:/workspaces/robot_ws/src/rtk2026_city_nav
      - ../../maps:/workspaces/robot_ws/maps
      - ../../records:/workspaces/robot_ws/records
    devices:
      - "/dev/serial/by-id/usb-Silicon_Labs_CP2102N_USB_to_UART_Bridge_Controller_5816f0d8d96ff0118dde93301045c30f-if00-port0:/dev/rplidar"
    init: true
    # Перезапуск ноды при неудачном рукопожатии делает сам launch через
    # respawn, поэтому здесь нужен только запуск.
    command:
      - bash
      - -lc
      - >-
        source /opt/ros/jazzy/setup.bash &&
        source /opt/vendor_ws/install/setup.bash &&
        source /workspaces/robot_ws/install/setup.bash &&
        ros2 launch rtk2026_bringup lidar_launch.py

  # ~ Только камера, без остального железа.
  #
  # Отдельный сервис по той же причине, что и lidar: docker резолвит
  # devices при старте, и объяви мы камеру в ros, стек не поднялся бы
  # без неё. Съёмка карты и запись видео - разные сеансы, и держать их
  # в одном контейнере значило бы связать их отказы.
  #
  # network_mode: host + ipc: host, домен тот же - поэтому камера
  # оказывается в одном ROS-графе с ros и arduino_bridge, и записывать
  # видео можно, катаясь телеопом.
  #
  #     docker compose -f pi/docker/docker-compose.pi.yml up -d camera
  #     docker logs -f rtk2026-camera
  camera:
    build:
      context: ../..
      dockerfile: pi/docker/Dockerfile.ros
    image: rtk2026-ros-pi
    container_name: rtk2026-camera
    network_mode: host
    ipc: host
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: "0"
      ROS_LOCALHOST_ONLY: "0"
    volumes:
      - ../../workspaces/robot_ws:/workspaces/robot_ws
      - ../../src/rtk2026_driver:/workspaces/robot_ws/src/rtk2026_driver
      - ../../src/rtk2026_description:/workspaces/robot_ws/src/rtk2026_description
      - ../../src/rtk2026_localization:/workspaces/robot_ws/src/rtk2026_localization
      - ../../src/rtk2026_slam:/workspaces/robot_ws/src/rtk2026_slam
      - ../../src/rtk2026_observability:/workspaces/robot_ws/src/rtk2026_observability
      - ../../src/rtk2026_bringup:/workspaces/robot_ws/src/rtk2026_bringup
      - ../../src/rtk2026_interfaces:/workspaces/robot_ws/src/rtk2026_interfaces
      - ../../src/rtk2026_pose_graph:/workspaces/robot_ws/src/rtk2026_pose_graph
      - ../../src/rtk2026_nav2:/workspaces/robot_ws/src/rtk2026_nav2
      - ../../src/rtk2026_city_nav:/workspaces/robot_ws/src/rtk2026_city_nav
      - ../../maps:/workspaces/robot_ws/maps
      - ../../records:/workspaces/robot_ws/records
    devices:
      # Номер, в отличие от serial-устройств, по by-id не адресуется.
      # Если камер несколько или номер уехал:  v4l2-ctl --list-devices
      - "/dev/video0:/dev/video0"
    init: true
    # camera_frame_id обязан совпадать с link в URDF, иначе кадр не
    # встанет в дерево TF и RViz не сможет его разместить.
    command:
      - bash
      - -lc
      - >-
        source /opt/ros/jazzy/setup.bash &&
        source /workspaces/robot_ws/install/setup.bash &&
        ros2 run v4l2_camera v4l2_camera_node --ros-args
        -p video_device:=/dev/video0
        -p image_size:="[640,480]"
        -p camera_frame_id:=camera_optical_frame

  # Camera and YOLO sign detection on the main Pi 5.
  #
  # This service replaces `camera` during autonomous runs: both services own
  # /dev/video0 and must not be started together. Keeping perception outside
  # `ros` means a missing camera or broken model cannot take down the hardware
  # and localization stack.
  #
  #     docker compose -f pi/docker/docker-compose.pi.yml stop camera
  #     docker compose -f pi/docker/docker-compose.pi.yml up -d --build perception
  #     docker logs -f rtk2026-perception
  perception:
    build:
      context: ../..
      dockerfile: pi/docker/Dockerfile.perception
    image: rtk2026-perception-pi5
    container_name: rtk2026-perception
    network_mode: host
    ipc: host
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: "0"
      ROS_LOCALHOST_ONLY: "0"
      RCUTILS_LOGGING_BUFFERED_STREAM: "0"
    volumes:
      # Python modules and launch/config files are symlink-installed, so edits
      # are picked up after restarting the service. Rebuild when messages or
      # dependencies change.
      - ../../src/rtk2026_interfaces:/workspace/src/rtk2026_interfaces
      - ../../src/rtk2026_cv:/workspace/src/rtk2026_cv
      - /etc/localtime:/etc/localtime:ro
    devices:
      - "/dev/video0:/dev/video0"
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    command:
      - bash
      - -lc
      - >-
        source /opt/ros/jazzy/setup.bash &&
        source /workspace/install/setup.bash &&
        ros2 launch rtk2026_cv sign_detection.launch.py
        params_file:=/workspace/install/rtk2026_cv/share/rtk2026_cv/config/sign_detection_pi5.yaml
