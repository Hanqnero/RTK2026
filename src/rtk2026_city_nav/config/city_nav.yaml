# Параметры движения по городу.
#
# Здесь всё, что описывает робота, полосу и политику выбора. Пути к графу
# и к файлу поз задаёт лаунч через FindPackageShare: в YAML их не записать,
# не прибив гвоздями расположение рабочего пространства.
#
# Значений по умолчанию в коде ноды нет. Параметры объявлены типами, поэтому
# отсутствие любого из них — отказ при запуске, а не молчаливое подставление
# числа, с которым робот поедет не туда.

# Ключ /** , а не city_nav: этот файл читают три исполняемых файла —
# нода движения и два инструмента проверки, — и у них разные имена нод.
# С ключом по имени --params-file не применился бы к инструментам.
/**:
  ros__parameters:

    # ~ Система координат целей Nav2 и публикуемого пути.
    frame_id: map

    # ~ Геометрия полосы.

    # Смещение центра полосы от разметочной линии. Граф задаёт линию, а не
    # осевую полосы, поэтому позы отодвигаются от него на эту величину.
    lane_offset_m: 0.2

    # Шаг постановки поз вдоль цепочки. Ноль означает, что позы ставятся
    # только в точках полилинии графа и лишних не добавляется.
    pose_step_m: 0.0

    # Сторона движения: 1 правостороннее, -1 левостороннее.
    traffic_side: 1

    # Предел выноса позы в остром изломе, в долях смещения. В изломе поза
    # уходит от вершины на lane_offset_m / cos(угол/2), и на развороте это
    # расходится; предел заменяет вынос двумя скруглёнными позами.
    miter_limit: 2.0

    # ~ Классификация маневров.

    # Полураствор класса «прямо» и, симметрично, класса «разворот».
    # Тридцать градусов воспроизводят разметку поворотов текущей трассы
    # полностью; менять есть смысл только вместе с проверкой графа.
    straight_tolerance_deg: 30.0

    # ~ Политика исполнения.

    # Сколько раз повторить участок, прежде чем остановиться. Отказы Nav2
    # бывают преходящими, и вставать с первого раза незачем.
    max_retries: 2

    # Длительность остановки, если знак её не задал, например автобусная.
    default_stop_duration_s: 2.0

    # Период, с которым двигается автомат исполнителя.
    control_period_s: 0.2

    # Не начинать движение, если проверка графа нашла ошибки. Ошибка
    # проверки означает недетерминированный выбор либо тупик, и выезжать
    # с таким графом смысла нет.
    halt_on_validation_error: true

    # ~ Начальное состояние и режимы задаёт лаунч, здесь их нет намеренно.
    #
    # start_previous_vertex и start_current_vertex — пара вершин, а не одна:
    # метка маневра зависит от направления прибытия. Зависят от того, где
    # робот поставлен перед прогоном, поэтому меняются каждый запуск.
    #
    # use_sign_cache — выбор режима, ради которого лаунч и существует.
    #
    # У каждого параметра один источник. Продублировать его здесь значило бы,
    # что значение по умолчанию из лаунча затрёт настроенное тут, причём молча.

    # ~ Детекции знаков.

    detection_topic: /perception/driving_detection

    # Порог принадлежности знака к ближайшей точке решения, пиксели
    # в квадрате. Не фильтр шума: знак впереди может относиться к
    # следующему перекрёстку, а отличить их можно только по видимому
    # размеру рамки.
    #
    # Ноль означает, что знаки не учитываются: детекции не читаются, маршрут
    # идёт по покрытию. Без порога далёкий знак был бы отнесён к текущей
    # точке решения, а это хуже, чем не читать знаки вовсе.
    #
    # Калибровка — подъехать к перекрёстку, писать route_box_area из
    # detection_topic и взять значение, которое рамка принимает на дистанции,
    # с которой знак уже должен учитываться.
    min_box_area_px: 0.0

    # Порог уверенности. Совпадает с порогом адаптера перцепции, чтобы
    # здесь не отсеивалось то, что там уже прошло.
    min_confidence: 0.25

    # ~ Память о знаках задаётся лаунчем, здесь её нет намеренно.
    #
    # Знаки стоят неподвижно и граф неподвижен, значит «состояние → знак» —
    # такая же функция, как таблица маневров, и доучивается она за проезд.
    # Выучив её, робот перестаёт зависеть от того, попал ли знак в кадр.
    #
    # use_sign_cache — переключатель режима, sign_cache_path — путь. Оба
    # у лаунча: режим выбирают при запуске, а путь в YAML не записать,
    # не прибив расположение рабочего пространства.
    #
    # Память привязана к отпечатку графа: изменилась геометрия — файл
    # отбрасывается, потому что подъезды задаёт она.

    # ~ Nav2.
    nav2_action_name: navigate_through_poses

    # Сколько ждать сервер действия перед тем, как считать участок
    # неисполненным. Отказ уходит в обычный повтор.
    nav2_server_timeout_s: 0.5

    # ~ Период публикации /diagnostics. Совпадает с остальными мониторами.
    diagnostic_period_s: 1.0
