# sign_behaviors.yaml
# Определяет траектории для каждого знака.
#
# sign_id:
#   2 = SIGN_LEFT (знак "левый поворот")
#   3 = SIGN_RIGHT (знак "правый поворот")
#   1 = SIGN_INTERSECTION (знак "перекрёсток")
#
# Каждый знак → список шагов (steps).
# Шаг: {linear_x, angular_z, duration_sec}
#   linear_x   — скорость вперёд (м/с)
#   angular_z  — угловая скорость (рад/с), + = лево, - = право
#   duration_sec — сколько секунд выполнять этот шаг
#
# После выполнения всех шагов — возврат к lane following.
#
# Чтобы добавить новый знак:
#   1. Добавь запись ниже с нужным sign_id
#   2. Перезапусти lane_mission ноду (или весь стек)

# trigger_distance_m — глобальная настройка в параметрах ноды (default 0.1 м = 10 см).
# Манёвр активируется только когда sign_distance <= trigger_distance_m.
#
# Расчёт duration_sec для поворота на угол:
#   duration_sec = угол_рад / angular_z  →  90° = 1.57 рад
#   При angular_z = 0.5 рад/с:  duration_sec = 1.57 / 0.5 = 3.14 сек
#   При angular_z = 1.0 рад/с:  duration_sec = 1.57 / 1.0 = 1.57 сек
#
# Расчёт duration_sec для прямолинейного движения:
#   duration_sec = расстояние_м / linear_x  →  20 см при 0.05 м/с = 4.0 сек

behaviors:
  "3":  # SIGN_RIGHT — правый поворот 90°
    name: "turn_right"
    cooldown_sec: 15.0
    steps:
      - {linear_x: 0.0,  angular_z:  0.0, duration_sec: 0.3}   # стоп перед поворотом
      - {linear_x: 0.0,  angular_z: -0.5, duration_sec: 3.14}  # поворот 90° вправо
      - {linear_x: 0.05, angular_z:  0.0, duration_sec: 2.0}   # прямо 10 см

  "2":  # SIGN_LEFT — левый поворот 90°
    name: "turn_left"
    cooldown_sec: 15.0
    steps:
      - {linear_x: 0.0,  angular_z:  0.0, duration_sec: 0.3}   # стоп перед поворотом
      - {linear_x: 0.0,  angular_z:  0.5, duration_sec: 3.14}  # поворот 90° влево
      - {linear_x: 0.05, angular_z:  0.0, duration_sec: 2.0}   # прямо 10 см

  "1":  # SIGN_INTERSECTION — прямо через перекрёсток
    name: "go_straight"
    cooldown_sec: 10.0
    steps:
      - {linear_x: 0.05, angular_z: 0.0, duration_sec: 4.0}    # прямо 20 см

# --- Примеры как добавить новые действия ---
#
# Разворот (U-turn):
#   "99":
#     name: "u_turn"
#     cooldown_sec: 20.0
#     steps:
#       - {linear_x: 0.0,  angular_z: 0.5, duration_sec: 6.0}
#
# Стоп на 3 сек потом вперёд:
#   "98":
#     name: "stop_and_go"
#     cooldown_sec: 8.0
#     steps:
#       - {linear_x: 0.0,  angular_z: 0.0, duration_sec: 3.0}
#       - {linear_x: 0.05, angular_z: 0.0, duration_sec: 1.0}
#
# Объезд слева:
#   "97":
#     name: "bypass_left"
#     cooldown_sec: 15.0
#     steps:
#       - {linear_x: 0.03, angular_z:  0.4, duration_sec: 1.5}
#       - {linear_x: 0.05, angular_z:  0.0, duration_sec: 2.0}
#       - {linear_x: 0.03, angular_z: -0.4, duration_sec: 1.5}
