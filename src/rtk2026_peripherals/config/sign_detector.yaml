sign_detector:
  ros__parameters:
    # Absolute path to the exported ONNX model.
    model_path: /home/robot/RTK2026/yolo/yolov8n_finetuned.onnx

    # Class names matching the training dataset (data.yaml names list).
    class_names:
      - bus_stop
      - move_forward
      - no_turn_left
      - no_turn_right
      - obstacle
      - parking_spot
      - turn_left
      - turn_right

    # RealSense color image topic.
    camera_topic: /camera/color/image_raw

    # Aligned depth topic — leave empty to disable depth gating.
    depth_topic: /camera/aligned_depth_to_color/image_raw

    # Inference image size (must match export_onnx.py --imgsz).
    imgsz: 320

    # Detection thresholds.
    conf_thresh: 0.40
    iou_thresh: 0.45

    # Depth gating range in metres.
    min_depth: 0.3
    max_depth: 15.0

    # ONNX Runtime CPU threads.
    num_threads: 4
