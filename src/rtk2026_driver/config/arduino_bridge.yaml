arduino_bridge:
  ros__parameters:

    # --- Serial порт ---
    serial_port: "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0"
    baudrate: 115200

    # --- Handshake ---
    # Сколько ждать первого фрейма телеметрии от Arduino после открытия порта
    handshake_timeout_sec: 5.0
    # Пауза между попытками чтения во время handshake
    handshake_poll_interval_sec: 0.01

    # --- Топики ---
    encoder_report_topic: "encoder_report"
    cmd_vel_topic: "cmd_vel"

    # --- Частоты и dead-man ---
    telemetry_poll_period_sec: 0.01
    command_send_interval_sec: 0.02
    drop_stale_cmd_after_sec: 0.30

    # --- Инверсия энкодеров ---
    # Используется только как runtime override поверх прошивки
    left_encoder_inverted: false
    right_encoder_inverted: false
