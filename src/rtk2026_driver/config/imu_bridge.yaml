imu_bridge:
  ros__parameters:

    # ~ Номер шины I2C Raspberry Pi.
    #
    # 1 соответствует /dev/i2c-1, то есть выводам GPIO2 (SDA) и
    # GPIO3 (SCL) на 40-контактной колодке.
    #
    # Шину надо включить на самой Pi:
    #
    #   sudo raspi-config nonint do_i2c 0
    #
    # и пробросить в контейнер, см. devices в pi/docker/docker-compose.pi.yml.
    i2c_bus: 1

    # ~ Адрес BMI270 на шине.
    #
    # 0x68 = 104 при SDO, притянутом к земле;
    # 0x69 = 105 при SDO, притянутом к питанию.
    #
    # YAML не понимает шестнадцатеричную запись, поэтому значение
    # десятичное. Проверяется командой i2cdetect -y 1.
    #
    # На стоящей плате SDO подтянут к питанию: опрос шины показал ответ
    # на 0x69 и молчание на 0x68, регистр CHIP_ID вернул 0x24 - это и
    # есть BMI270. Прежние 104 (0x68) относились к другой распайке.
    i2c_address: 105

    # ~ Топик и система координат публикуемого сообщения.
    #
    # Тип: sensor_msgs/msg/Imu
    #
    # imu0 в ekf_real.yaml обязан совпадать с imu_topic, а frame_id -
    # с именем link в rtk2026_real.urdf.xacro.
    imu_topic: "/imu/data"
    frame_id: "imu_link"

    # ~ Частота публикации сообщений, Гц.
    #
    # Согласована с frequency: 50.0 у EKF: датчик опережает фильтр
    # вдвое, и ни одно обновление EKF не остаётся без свежего замера.
    publish_rate_hz: 100.0

    # ~ Частота выдачи данных самим чипом, Гц.
    #
    # Допустимые значения: 25, 50, 100, 200, 400, 800.
    #
    # Должна быть не ниже publish_rate_hz, иначе часть сообщений
    # повторит один и тот же отсчёт, а EKF примет повторы за
    # независимые измерения и станет доверять им сильнее, чем следует.
    sensor_odr_hz: 100

    # ~ Предел акселерометра, g. Допустимо: 2, 4, 8, 16.
    #
    # Ускорения самого робота лежат в пределах 1 g, но гусеничное шасси
    # даёт удары на стыках, а зашкал акселерометра выглядит как реальное
    # ускорение. 4 g - запас без заметной потери разрешения.
    accel_range_g: 4

    # ~ Предел гироскопа, °/с. Допустимо: 125, 250, 500, 1000, 2000.
    #
    # Рабочая угловая скорость робота ограничена 90 °/с
    # (kMaxAngularCommandRadS = pi/2), так что запас здесь большой.
    #
    # Сузить диапазон до 500 или 250 имеет смысл: цена младшего разряда
    # падает вдвое и вчетверо, а вместе с ней и шум курса. Делать это
    # стоит после проверки, что удары гусениц не дают зашкала.
    gyro_range_dps: 1000

    # ~ Оценка нуля гироскопа при запуске ноды.
    #
    # РОБОТ ПРИ СТАРТЕ ОБЯЗАН СТОЯТЬ.
    #
    # Смещение нуля BMI270 составляет единицы градусов в секунду. EKF
    # его интегрирует, поэтому некомпенсированный ноль превращается в
    # равномерный уход курса даже у неподвижного робота, а за ним
    # разъезжается и карта.
    calibrate_gyro_bias: true

    # ~ Число усредняемых отсчётов.
    #
    # 200 отсчётов по 5 мс это около одной секунды неподвижности.
    gyro_bias_samples: 200

    # ~ Порог отбраковки калибровки, рад/с.
    #
    # Если среднее превысило порог, робот при старте двигали. Поправка
    # тогда не применяется, а в лог уходит ERROR: вычесть скорость
    # движения из нуля хуже, чем не калибровать вовсе.
    #
    # 0.20 рад/с это 11.5 °/с - заведомо больше реального смещения и
    # заведомо меньше скорости осмысленного поворота.
    gyro_bias_max_rps: 0.20

    # ~ Диагональ ковариации угловой скорости: vx, vy, vz.
    #
    # 0.0004 рад²/с² соответствует СКО 0.02 рад/с, то есть примерно
    # 1.15 °/с. Это стартовая оценка, а не результат измерения: уточнять
    # надо по разбросу неподвижных показаний, которые печатает
    # калибровка при запуске.
    angular_velocity_covariance_diagonal: [0.0004, 0.0004, 0.0004]

    # ~ Диагональ ковариации линейного ускорения: ax, ay, az.
    #
    # В ekf_real.yaml ускорения выключены, значение существует ради
    # прочих потребителей /imu/data.
    linear_acceleration_covariance_diagonal: [0.04, 0.04, 0.04]

    # ~ Путь к образу конфигурации BMI270.
    #
    # Пустая строка означает штатный файл из share пакета:
    # config/bmi270_config.bin, 8192 байта из BMI270_SensorAPI v2.86.1.
    #
    # Без этого образа чип не измеряет ничего: внутри стоит собственный
    # микроконтроллер, и прошивку в него заливает хост при старте.
    config_file: ""

    # ~ Период отчёта о состоянии обмена в логе, с.
    link_report_period_sec: 10.0
