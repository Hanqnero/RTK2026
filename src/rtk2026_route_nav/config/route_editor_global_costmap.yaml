# Global costmap: static + inflation. Нода nav2_costmap_2d: FQN /costmap/costmap
# (см. Costmap2DROS(name, "/", name) — namespace /costmap, имя costmap).
# Параметры задаются плоско на этой ноде (без вложенного global_costmap — это только для composed bringup).
/costmap:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    footprint_padding: 0.003
    update_frequency: 2.0
    publish_frequency: 2.0
    resolution: 0.05
    robot_radius: 0.15
    rolling_window: false
    track_unknown_space: true
    always_send_full_costmap: true
    plugins: ["static_layer", "inflation_layer"]
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_subscribe_transient_local: true
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 4.0
      inflation_radius: 0.02
