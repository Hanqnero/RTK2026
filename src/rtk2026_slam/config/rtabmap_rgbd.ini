[Core]

# Обрабатываем граф с частотой 2 Гц, хотя RGB-D поступает чаще.
# Это уменьшает нагрузку без снижения частоты локальной EKF-одометрии.
Rtabmap/DetectionRate=2.0
Rtabmap/TimeThr=700

# Gazebo передаёт depth как float32. Явно используем PNG вместо
# несовместимого с этим форматом значения RVL по умолчанию.
Mem/DepthCompressionFormat=.png

# Робот движется только по плоскости: x, y, yaw.
Reg/Force3DoF=true
RGBD/ForceOdom3DoF=true

# Поиск замыканий цикла среди соседних по пространству поз.
RGBD/ProximityBySpace=true

# Не создаём почти одинаковые вершины при очень медленном движении.
RGBD/LinearUpdate=0.05
RGBD/AngularUpdate=0.05

# Ограничиваем число признаков для работы на Raspberry Pi 5.
Kp/MaxFeatures=800
Vis/MaxFeatures=800

# Строим occupancy grid исключительно по RGB-D.
# Grid/Sensor: 0=лидар, 1=depth, 2=лидар+depth.
Grid/Sensor=1
Grid/3D=true
Grid/RayTracing=false

# Разрешение 25 мм соответствует масштабу балок полигона.
Grid/CellSize=0.010
Grid/DepthDecimation=2
Grid/RangeMin=0.10
Grid/RangeMax=3.0

# Убираем из облака точки, попавшие в корпус робота.
Grid/FootprintLength=0.30
Grid/FootprintWidth=0.24
Grid/FootprintHeight=0.20

# Для низкой камеры делим пол и препятствия по высоте.
# Поверхности до 12 мм считаются полом, балки высотой 25 мм — препятствиями.
Grid/NormalsSegmentation=false
Grid/MinGroundHeight=-0.05
Grid/MaxGroundHeight=0.012
Grid/MaxObstacleHeight=0.40

# Маркер мира: OpenCV DICT_4X4_50, id=0.
# Плоскость модели имеет размер 0.50 м, но сам маркер без белой рамки — 0.40 м.
Marker/Dictionary=0
Marker/Length=0.40
