slam_toolbox:
  ros__parameters:
    # Источник времени задаёт launch: true для Gazebo и false для робота.
    odom_frame: odom # ? имя локальной системы координат колесной одометрии
    map_frame: map # ? глобальсая система координат создаваемой карты
    base_frame: base_footprint # ? система координат основания робота.
    scan_topic: /scan # ? топик с лазерными сканами
    use_map_saver: false # & создавать встроенный сервис сохранения обычной растровой карты
    mode: mapping # Режим работы slam_toolbox
                    # ~ mapping:
                    # строит новую карту и расширяет pose graph.
                    # ~ localization:
                    # загружает существующий сериализованный pose graph и использует его для локализации.
    debug_logging: false # & включить подробные отладочные сообщения slam_toolbox.
    throttle_scans: 1 # & Обрабатывать каждый N-й лазерный скан (1 означает обрабатывать каждый скан)
    transform_publish_period: 0.02 # ? Период публикации TF map -> odom в секундах
    map_update_interval: 0.5 # & Период пересоздания и публикации nav_msgs/OccupancyGrid (в сек)
    # & Размер одной ячейки occupancy grid в метрах.
    #
    # Определяется самым мелким объектом, который карта обязана показать.
    # Задача - здания и стены: домик 0.5 м занимает 25 ячеек, этого хватает
    # и для карты, и для costmap. Столбики 0.02 м в требования не входят,
    # их разрешение всё равно ограничено лидаром: с трёх метров столбик
    # даёт один-два замера и от шума неотличим.
    #
    # Арена 4 x 4 м даёт сетку 200 x 200 ячеек.
    resolution: 0.02
    min_laser_range: 0.12 # & Минимальная рабочая дальность RPLIDAR C1; более близкие возвраты не используем при растеризации
    # & Максимальная дальность, используемая при растеризации карты.
    #
    # Паспортные 12 м у C1 избыточны для арены 4 x 4 м: её диагональ
    # 5.7 м, а всё, что дальше, - это возвраты из-за стен и шум. Обрезка
    # заодно уменьшает область, которую slam_toolbox растеризует каждый цикл.
    #
    # Величина задана ареной, а не лидаром: при смене лидара она не меняется.
    max_laser_range: 6.0
    # & Минимальное время между двумя обрабатываемыми сканами, сек.
    #
    # Ноль означает "обрабатывать всё, что прошло пороги перемещения": темп
    # задаёт сам лидар, а не этот параметр. Прежние 0.2 были больше периода
    # скана у обоих лидаров - у C1 на 10 Гц это 0.1 с, - поэтому каждый
    # второй скан отбрасывался и обработка шла вдвое реже, чем могла.
    #
    # Порог по времени осмыслен, когда лидар быстрее, чем успевает считать
    # машина. Здесь ограничитель обратный, и фильтровать поток должны
    # minimum_travel_distance и minimum_travel_heading ниже.
    minimum_time_interval: 0.0
    transform_timeout: 0.2 # ? Максимальное время ожидания требуемого TF в секундах
    tf_buffer_duration: 30.0 # ? Продолжительность истории, хранящейся во внутреннем TF-буфере
    scan_queue_size: 1 # & Для online_async обрабатываем актуальный скан и не накапливаем очередь устаревших измерений
    stack_size_to_use: 40000000 # Размер стека процесса в байтах (+- 40 мб)
    enable_interactive_mode: true # Разрешить интерактивное редактирование pose graph через RViz-плагин.
    use_scan_matching: true # Использовать сопоставление лазерных сканов для уточнения начальной позы, полученной из колесной одометрии
    use_scan_barycenter: true # Использовать геометрический центр облака точек скана вместо исходной позы лазерного сенсора как опорную точку сопоставления.
    minimum_travel_distance: 0.05 # Минимальное линейное перемещение робота перед добавлением следующего обработанного скана в pose graph (в м)
    minimum_travel_heading: 0.05 # Минимальное изменение курса перед добавлением следующего скана (в радианах, 2.86 градуса)
    # Длина локальной цепочки сканов, кадров.
    #
    # Прежние 10 кадров при 10 Гц покрывали всего четверть метра пути:
    # сопоставление опиралось на секунду истории и потому сильно зависело
    # от одометрии. Тридцать кадров дают около 0.75 м контекста в помещении
    # размером 4 м, и локализация становится устойчивее.
    #
    # Цена - вычисления на каждый скан. Значение подлежит проверке под
    # реальной нагрузкой на Pi 5: если цикл SLAM начнёт отставать, это
    # хуже короткой цепочки, и число надо снижать.
    scan_buffer_size: 30
    # Максимальное расстояние от текущей позы до кадра в цепочке, м.
    #
    # Согласовано с max_laser_range: хранить кадры дальше, чем видит лидар,
    # бессмысленно - с текущим сканом они всё равно не пересекаются.
    # Прежние 10.0 превышали и дальность лидара, и размер арены, поэтому
    # отсев по расстоянию не работал вовсе.
    scan_buffer_maximum_scan_distance: 6.0
    link_match_minimum_response_fine: 0.1 # Минимально допустимый отклик точного локального сопоставления двух связанных сканов
    link_scan_maximum_distance: 1.5 # Максимальное расстояние в метрах между сканами, которые разрешается соединить обычным последовательным ограничением
    # Максимальное расстояние до старых сканов - кандидатов на замыкание.
    #
    # Намеренно оставлено узким. Арена симметрична: противоположные углы
    # и одинаковые домики дают похожие сканы, и широкий радиус поиска
    # склеил бы разные места. Ложное замыкание рвёт карту целиком, тогда
    # как пропущенное лишь оставляет накопленный дрейф, а он после
    # калибровки привода невелик.
    loop_search_maximum_distance: 1.0
    do_loop_closing: true # Включить поиск замыканий цикла
    # Минимальная длина цепочки-кандидата, кадров.
    #
    # Чем длиннее цепочка, тем она различимее: одиночный похожий скан
    # в симметричной локации встречается легко, а совпадение двух десятков
    # подряд - уже нет. Это основная защита от ложного замыкания.
    loop_match_minimum_chain_size: 20
    loop_match_maximum_variance_coarse: 3.0 # Максимально допустимая внутренняя оценка разброса результата грубого поиска замыкания цикла
    # Пороги отклика подняты относительно значений по умолчанию: в
    # симметричной среде посредственное совпадение почти наверняка ложное.
    loop_match_minimum_response_coarse: 0.60
    loop_match_minimum_response_fine: 0.70
    # Линейный размер поисковой области обычного scan matching, м.
    #
    # Оставлено широким намеренно. Окно строится вокруг предсказания
    # одометрии, и сузить его до 0.3 можно было бы втрое дешевле по
    # вычислениям, но узкое окно проигрывает там, где одометрия ошиблась
    # сильнее ожидаемого: сопоставление срывается и дрейф закрепляется
    # в карте. Вычислительный запас на Pi 5 есть, качество важнее.
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01 # Пространственный шаг поисковой сетки scan matching в метрах
    correlation_search_space_smear_deviation: 0.1 # Стандартное отклонение размытия откликов поисковой сетки.
    loop_search_space_dimension: 1.2 # Линейный размер поисковой области при проверке loop closure
    loop_search_space_resolution: 0.05 # Пространственный шаг сетки грубого поиска loop closure в метрах
    loop_search_space_smear_deviation: 0.03 # Стандартное отклонение размытия откликов
    distance_variance_penalty: 0.5 # Коэффициент штрафа за линейное отклонение найденной позиции скана
    angle_variance_penalty: 1.0 # Коэффициент штрафа за угловое отклонение найденной ориентации
    fine_search_angle_offset: 0.00349 # Диапазон проверки углов на точном этапе scan matching
    coarse_search_angle_offset: 0.349 # Диапазон проверки углов на грубом этапе scan matching
    coarse_angle_resolution: 0.0349 # Шаг перебора углов при грубом scan matching (в радианах)
    minimum_angle_penalty: 0.9 # Нижняя граница углового штрафа
    minimum_distance_penalty: 0.5 # Нижняя граница линейного штрафа
    use_response_expansion: true # Автоматически расширять поисковую область, если в исходной области не найдено приемлемого совпадения
    solver_plugin: solver_plugins::CeresSolver # Плагин нелинейного оптимизатора pose graph
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY # Метод решения линейной системы внутри Ceres
    ceres_preconditioner: SCHUR_JACOBI # Предобуславливатель Ceres
    ceres_trust_strategy: LEVENBERG_MARQUARDT # Стратегия изменения доверительной области во время нелинейной оптимизации
    ceres_dogleg_type: TRADITIONAL_DOGLEG # Тип алгоритма Dogleg
    ceres_loss_function: None # Робастная функция потерь для ограничений pose graph
