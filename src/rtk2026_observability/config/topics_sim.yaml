# Общие topics tracked-симуляции.
#
# expected_rate проверяется по timestamp самого сообщения, а не по wall time.
# Поэтому real_time_factor Gazebo не влияет на результат.

topics:

  scan:
    topic: /scan
    type: sensor_msgs/msg/LaserScan
    required: true
    expected_rate: 10.0
    tolerance: 0.25
    window_size: 20
    max_age: 0.5
    stamp_field: header.stamp
    qos: sensor_data

  imu:
    topic: /imu/data
    type: sensor_msgs/msg/Imu
    required: true
    expected_rate: 100.0
    tolerance: 0.20
    window_size: 50
    max_age: 0.2
    stamp_field: header.stamp
    qos: sensor_data

  wheel_odometry:
    topic: /wheel/odom
    type: nav_msgs/msg/Odometry
    required: true
    expected_rate: 50.0
    tolerance: 0.20
    window_size: 30
    max_age: 0.3
    stamp_field: header.stamp
    qos: system_default

  filtered_odometry:
    topic: /odometry/filtered
    type: nav_msgs/msg/Odometry
    required: true
    expected_rate: 50.0
    tolerance: 0.20
    window_size: 30
    max_age: 0.3
    stamp_field: header.stamp
    qos: system_default

  ground_truth_odometry:
    topic: /ground_truth/odom
    type: nav_msgs/msg/Odometry
    required: true
    expected_rate: 50.0
    tolerance: 0.20
    window_size: 30
    max_age: 0.3
    stamp_field: header.stamp
    qos: system_default

  cmd_vel:
    topic: /cmd_vel
    type: geometry_msgs/msg/TwistStamped

    # Команда событийная: её отсутствие при стоящем роботе не является
    # неисправностью системы.
    required: false
    expected_rate: 0.0
    max_age: 0.0
    stamp_field: header.stamp
    qos: system_default
