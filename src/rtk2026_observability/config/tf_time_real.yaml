# TF и временные контракты реального робота в режиме картографирования.

transforms:
  - key: map_to_odom
    parent: map
    child: odom
    required: true
    max_age: 1.0
    # Коррекция SLAM может немного сдвигать odom, но большой одиночный
    # скачок обычно означает плохое сопоставление scan.
    translation_jump_warn: 0.50
    yaw_jump_warn: 0.50

  - key: odom_to_base
    parent: odom
    child: base_footprint
    required: true
    max_age: 0.20
    translation_jump_warn: 0.10
    yaw_jump_warn: 0.20

chains:
  - key: base_to_lidar
    parent: base_footprint
    child: lidar_frame
    required: true

  # base_to_imu не проверяется: статический TF до imu_link публикуется
  # из URDF, но данных по этой ветке нет, пока не написана нода BMI270.

streams:
  - key: scan
    topic: /scan
    type: sensor_msgs/msg/LaserScan
    frame_id: lidar_frame
    required: true
    max_age: 0.5
    qos: sensor_data

  - key: wheel_odom
    topic: /wheel/odom
    type: nav_msgs/msg/Odometry
    frame_id: odom
    required: true
    max_age: 0.3

    # Сверка идёт со сканом, а не с IMU: без ноды BMI270 промежуточного
    # звена нет. Допуск шире, чем был между odom и imu, потому что темп
    # лидара вчетверо ниже темпа одометрии, и рассогласование в четверть
    # периода скана здесь нормально.
    compare_with: scan
    max_skew: 0.25

  - key: filtered_odom
    topic: /odometry/filtered
    type: nav_msgs/msg/Odometry
    frame_id: odom
    required: true
    max_age: 0.3
    compare_with: wheel_odom
    max_skew: 0.10
