# Проверки содержимого сенсорных сообщений реального робота.

lidar:
  topic: /scan

  # Число лучей за оборот. A1M8 отдаёт около 8000 замеров в секунду и
  # вращается на паспортных 5.5 Гц, что даёт примерно 1455 лучей.
  #
  # Значение сверяется с фактическим при первом запуске: драйвер с
  # angle_compensate округляет его по-своему, и предсказать точное число
  # из паспорта нельзя.
  expected_rays: 1455

  expected_angle_span: 6.283185307179586

  # Inf является нормальным ответом «препятствие дальше range_max».
  #
  # Порог ниже симуляционного: арена меньше дальности лидара, и часть
  # лучей уходит за её пределы, не встречая ничего.
  min_finite_ratio: 0.05
  max_nan_ratio: 0.01

  # При неподвижном роботе scan закономерно одинаков, поэтому порог большой.
  unchanged_warn_count: 300

# Секция imu не заполняется: нода BMI270 не реализована, и проверять
# нечего. Появится нода - вернётся и она, вместе с порогами насыщения
# из паспорта датчика.

drive:
  odometry_topic: /wheel/odom
  command_topic: /cmd_vel
  command_timeout: 0.5

  # Порог, ниже которого движение считается отсутствующим.
  #
  # Проверка ловит расхождение знака команды и знака измеренной скорости,
  # то есть ровно ту ошибку распайки, которую на стенде ищет
  # verify_signs.py. На роботе она должна быть уже исключена, и монитор
  # здесь работает как страховка после переборки железа.
  motion_threshold: 0.03
  direction_velocity_threshold: 0.03
  direction_window: 100
  minimum_checks: 20
  max_mismatch_ratio: 0.10
