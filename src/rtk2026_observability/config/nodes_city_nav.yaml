# Нода движения по городу.
#
# Собственную диагностику city_nav публикует сам задачами CityNav/*: только
# он знает своё положение в маршруте и почему выбрал маневр. Здесь то, что
# видно снаружи и одинаково для любой ноды: присутствие в ROS graph и
# свежие WARN/ERROR из /rosout.
#
# Стек, который исполняет цели, проверяется отдельно в nodes_nav2.yaml:
# он нужен не только городскому движению.

nodes:

  city_nav:
    node: /city_nav
    required: true
    loggers:
      - city_nav
