# MeArm Servo Configuration
# Define servo limits and calibration values

servo_limits:
  0:  # Base rotation servo
    min: 45
    max: 135
    neutral: 90
    
  1:  # Right arm servo
    min: 0
    max: 180
    neutral: 90
    
  2:  # Left arm servo
    min: 0
    max: 180
    neutral: 90
    
  3:  # Gripper servo
    min: 0
    max: 180
    neutral: 90

# Preset positions for common arm configurations
presets:
  rest:
    servos: [90, 90, 90, 90]
    description: "Neutral rest position"
    
  grab_forward:
    servos: [90, 60, 100, 45]
    description: "Arm extended forward for grasping"
    
  grab_up:
    servos: [90, 30, 70, 45]
    description: "Arm reaching upward"
    
  grab_left:
    servos: [45, 90, 90, 90]
    description: "Arm rotated to the left"
    
  grab_right:
    servos: [135, 90, 90, 90]
    description: "Arm rotated to the right"
    
  stowed:
    servos: [90, 160, 0, 135]
    description: "Fully retracted position"
