ekf_filter_node:
  ros__parameters:

    # Временный деградированный режим для стендовой проверки без BMI270.
    # Для штатного движения используйте ekf_real.yaml с отдельной Pi IMU.
    frequency: 50.0
    sensor_timeout: 0.3
    two_d_mode: true

    transform_time_offset: 0.0
    transform_timeout: 0.0

    print_diagnostics: true
    debug: false
    publish_acceleration: false

    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /wheel/odom

    # Без IMU временно используем энкодерные vx, vy=0 и vyaw.
    odom0_config:
      [false, false, false,
       false, false, false,
       true,  true,  false,
       false, false, true,
       false, false, false]

    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    use_control: false
