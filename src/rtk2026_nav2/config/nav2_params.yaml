# Параметры стека Nav2.
#
# Ездить по присланным позам умеет сам Nav2 действием navigate_through_poses:
# отдельной ноды-исполнителя здесь нет и не нужно. Пакет владеет настройкой
# стека и его запуском, а кто присылает позы — его не касается.
#
# use_sim_time и пути к деревьям поведения перезаписывает лаунч через
# RewrittenYaml: время должно быть одним на все ноды и вложенные costmap,
# а пути не должны быть прибиты к раскладке контейнера.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    navigators: ["navigate_to_pose", "navigate_through_poses"]

    # Оба пути подставляет лаунч. Значения здесь только чтобы ключи
    # существовали для перезаписи.
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""

    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    costmap_update_timeout: 0.3

    # TwistStamped, потому что этого типа ждут оба потребителя /cmd_vel:
    # мост Gazebo и arduino_bridge реального робота. При false стек
    # публикует Twist, подписчиков у него нет, и робот не двигается,
    # хотя цель считается активной.
    enable_stamped_cmd_vel: true
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 20.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      # Промежуточные точки не пропускаем, но допуск реалистичный.
      xy_goal_tolerance: 0.16
      yaw_goal_tolerance: 0.90
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.24
      lookahead_dist: 0.45
      min_lookahead_dist: 0.22
      max_lookahead_dist: 0.65
      lookahead_time: 1.0
      rotate_to_heading_angular_vel: 0.8
      transform_tolerance: 0.2
      max_robot_pose_search_dist: 2.0
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.45
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_velocity_scaled_lookahead_dist: true
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      regulated_linear_scaling_min_radius: 0.7
      regulated_linear_scaling_min_speed: 0.12
      use_rotate_to_heading: false
      allow_reversing: false
      rotate_to_heading_min_angle: 0.55
      stateful: true
      use_dynamic_window: false

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      # Компромиссный допуск: не слишком жёстко, но без вольных перестроений.
      tolerance: 0.60
      use_astar: true
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      footprint_padding: 0.005

      # Фактический прямоугольник робота в системе base_footprint.
      #
      # base_footprint лежит на земле под осью привода, а не в центре
      # робота: вперёд от него 120 мм, назад 240 мм. Поэтому прямоугольник
      # несимметричный. Центрировать его на кадре нельзя — Nav2 считал бы,
      # что робот выступает вперёд на 60 мм больше, чем есть, и на столько
      # же меньше назад.
      #
      # Числа берутся из модели rtk2026_tracked_sim, 310 x 246 мм: наружные
      # габариты задают колёса гусениц (x от -0.215 до +0.095) и сами
      # гусеницы (y +-0.123). Корпус внутри этого.
      #
      # Не robot_radius: круг радиуса 0.16 поперёк завышает робота на 37 мм,
      # а дорога всего 800 мм. При смещении полосы 200 мм это оставляет
      # 15 мм до стены — меньше, чем inflation_radius, то есть полоса
      # оказалась бы закрашена как непроезжая.
      footprint: "[ [0.095, 0.123], [0.095, -0.123], [-0.215, -0.123], [-0.215, 0.123] ]"
      rolling_window: false
      track_unknown_space: true
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          inf_is_valid: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.02


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      footprint_padding: 0.005

      # Фактический прямоугольник робота в системе base_footprint.
      #
      # base_footprint лежит на земле под осью привода, а не в центре
      # робота: вперёд от него 120 мм, назад 240 мм. Поэтому прямоугольник
      # несимметричный. Центрировать его на кадре нельзя — Nav2 считал бы,
      # что робот выступает вперёд на 60 мм больше, чем есть, и на столько
      # же меньше назад.
      #
      # Числа берутся из модели rtk2026_tracked_sim, 310 x 246 мм: наружные
      # габариты задают колёса гусениц (x от -0.215 до +0.095) и сами
      # гусеницы (y +-0.123). Корпус внутри этого.
      #
      # Не robot_radius: круг радиуса 0.16 поперёк завышает робота на 37 мм,
      # а дорога всего 800 мм. При смещении полосы 200 мм это оставляет
      # 15 мм до стены — меньше, чем inflation_radius, то есть полоса
      # оказалась бы закрашена как непроезжая.
      footprint: "[ [0.095, 0.123], [0.095, -0.123], [-0.215, -0.123], [-0.215, 0.123] ]"
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 5.0
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          inf_is_valid: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.02


behavior_server:
  ros__parameters:
    use_sim_time: true
    # То же, что и у controller_server: поведения ездят через тот же /cmd_vel.
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 1.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - planner_server
      - controller_server
      - behavior_server
      - bt_navigator
