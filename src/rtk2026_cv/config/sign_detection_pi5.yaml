# USB camera and sign detection on the main Raspberry Pi 5.
#
# The detector is deliberately launched in a separate container from the
# drivetrain stack. Losing the camera or model must not stop the robot's
# hardware, localization, or navigation nodes.

camera:
  ros__parameters:
    video_device: /dev/video0
    image_size: [640, 480]
    output_encoding: rgb8
    time_per_frame: [1, 15]
    camera_frame_id: camera_optical_frame

onnx_sign_detector:
  ros__parameters:
    image_topic: /camera/image_raw
    output_topic: /perception/driving_detection

    debug_overlay: false
    debug_overlay_topic: /perception/detection_overlay
    debug_image_topic: /perception/detection_overlay/compressed

    # 416 is the safe starting point while localization and navigation share
    # the Pi. Raise this to 640 only after measuring CPU load and frame age.
    input_size: 416
    conf_threshold: 0.35
    nms_threshold: 0.45
    every_n_frames: 1
    intra_op_num_threads: 2
    inter_op_num_threads: 1
    publish_empty: true
    log_every_n_frames: 30
    stop_duration_sec: 2.0

    class_id_to_label:
      - "0=bus_stop"
      - "1=move_forward"
      - "2=no_turn_left"
      - "3=no_turn_right"
      - "4=obstacle"
      - "5=parking_spot"
      - "6=turn_left"
      - "7=turn_right"

    class_id_to_route_command:
      - "1=straight_only"
      - "2=no_left_turn"
      - "3=no_right_turn"
      - "6=left_only"
      - "7=right_only"

    class_id_to_stop_action:
      - "0=bus_stop"

    # Preserve the existing integration semantics: class 4 is labelled
    # obstacle by the model but is consumed as the bus object by city_nav.
    # Verify this mapping against the final competition dataset.
    bus_class_ids:
      - "4"
